name: Build and Upload Artifacts

on:
  workflow_dispatch: # 手动触发构建
    inputs:
      os:
        description: 'Runner OS'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-20.04

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: riscv64
          # Windows
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          # macOS (Darwin)
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set environment variables
        shell: bash
        run: |
          DEPLOY_DIR="${{ github.workspace }}/build"
          TARGET="${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}"
          DEST="$DEPLOY_DIR/$TARGET"

          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          BIN_NAME="tg"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BIN_NAME="tg.exe"
          fi

          mkdir -p "$DEST"
          go build -v -trimpath -buildvcs=false -ldflags "-w -s" -o "$DEST/$BIN_NAME" ./cmd/tg

          # Generate sha256 checksum
          cd "$DEST"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BIN_NAME" > "${BIN_NAME}.sha256"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-${{ env.TARGET }}
          path: ${{ env.DEST }}
